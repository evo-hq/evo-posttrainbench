workspace: gh-evo-hq-evo-posttrainbench
goal:
  metric: score
  direction: max
baseline: auto
rules:
  win_threshold: 0
  harm_threshold: 0
  min_n: 20
  max_n: 400
profile:
  blast_radius: sandbox
direction_source: inferred
triggers:
  - metric: score
    comparator: <
    baseline: auto
    source:
      kind: harness
    interval_minutes: 60
    action: optimize
notes:
  - 'harness INFERRED from src/eval/tasks/aime2025/evaluate.py:1 (evaluation-named script); verify it emits JSON lines'
  - 'goal INFERRED: eval script found, guessing score/max'
  - 'optimize.on_accept: once this config is accepted, evo calibrates the harness, resolves baselines, and starts the first optimization run automatically (needs an optimize.proposer; set on_accept: false to disable)'
harness: python src/eval/tasks/aime2025/evaluate.py
optimize:
  on_accept: true
